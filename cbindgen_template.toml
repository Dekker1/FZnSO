language = "C"

# Wrapping header contents
documentation_style = "c99"
no_includes = true
includes = ["fznso_types.h"]
cpp_compat = false
usize_is_size_t = true

[parse]
parse_deps = true

[export]
exclude = [
  "FznsoAnnotation",
  "FznsoConstraintList",
  "FznsoConstraintType",
  "FznsoFloatRange",
  "FznsoIntRange",
  "FznsoModel",
  "FznsoModelMethods",
  "FznsoModelRef",
  "FznsoObjective",
  "FznsoObjectiveList",
  "FznsoOption",
  "FznsoOptionList",
  "FznsoSolution",
  "FznsoSolutionMethods",
  "FznsoSolutionRef",
  "FznsoSolver",
  "FznsoStatistic",
  "FznsoStatisticList",
  "FznsoStatus",
  "FznsoStr",
  "FznsoType",
  "FznsoTypeBase",
  "FznsoTypeList",
  "FznsoValue",
  "FznsoValueKind",
  "FznsoValueMethods",
  "FznsoValueRef",
]

[export.rename]
"FznsoPtr_FznsoSolver" = "const FznsoSolver *"
