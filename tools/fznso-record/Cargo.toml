[package]
name = "fznso-record"
description = "Record the calls into an FZnSO solver, to replay them later"
repository.workspace = true
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

# The proxy solver. The library name is its symbol prefix: `librecord` exports
# `fznso_record_*`.
[lib]
name = "record"
crate-type = ["cdylib"]

[dependencies]
fznso = { path = "../../rust/fznso", version = "0.1.0", features = ["serde"] }
fznso-record-format = { path = "../fznso-record-format", version = "0.1.0" }

[lints]
workspace = true
