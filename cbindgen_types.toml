language = "C"

# Wrapping header contents
include_guard = "fznso_types_h"
documentation_style = "c99"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
usize_is_size_t = true

[export]
include = [
  "FznsoAnnotation",
  "FznsoConstraintList",
  "FznsoConstraintType",
  "FznsoFloatRange",
  "FznsoIntRange",
  "FznsoModel",
  "FznsoModelMethods",
  "FznsoModelRef",
  "FznsoObjective",
  "FznsoObjectiveList",
  "FznsoOption",
  "FznsoOptionList",
  "FznsoSolution",
  "FznsoSolutionMethods",
  "FznsoSolutionRef",
  "FznsoSolver",
  "FznsoStatistic",
  "FznsoStatisticList",
  "FznsoStatus",
  "FznsoType",
  "FznsoTypeBase",
  "FznsoTypeList",
  "FznsoValue",
  "FznsoValueKind",
  "FznsoValueMethods",
  "FznsoValueRef",
]

[export.rename]
"FznsoPtr_FznsoAnnotation" = "const FznsoAnnotation *"
"FznsoPtr_FznsoModel" = "const FznsoModel *"
"FznsoPtr_FznsoSolution" = "const FznsoSolution *"
"FznsoPtr_FznsoValue" = "const FznsoValue *"
