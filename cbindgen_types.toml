language = "C"

# Wrapping header contents
include_guard = "ipdos_types_h"
documentation_style = "c99"
sys_includes = ["stdbool", "stdint"]
no_includes = true

[export]
include = [
  "IpdosAnnotation",
  "IpdosConstraintType",
  "IpdosConstraintList",
  "IpdosModelRef",
  "IpdosModel",
  "IpdosModelMethods",
  "IpdosObjective",
  "IpdosObjectiveList",
  "IpdosOption",
  "IpdosOptionList",
  "IpdosSolutionRef",
  "IpdosSolution",
  "IpdosSolver",
  "IpdosStatus",
  "IpdosType",
  "IpdosTypeBase",
  "IpdosTypeList",
  "IpdosValue",
  "IpdosValueContent",
  "IpdosValueKind",
]
