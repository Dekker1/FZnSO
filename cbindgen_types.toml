language = "C"

# Wrapping header contents
include_guard = "ipdos_types_h"
documentation_style = "c99"
sys_includes = ["stdbool.h", "stdint.h"]
no_includes = true
usize_is_size_t = true

[export]
include = [
  "IpdosAnnotation",
  "IpdosConstraintList",
  "IpdosConstraintType",
  "IpdosModel",
  "IpdosModelMethods",
  "IpdosModelRef",
  "IpdosObjective",
  "IpdosObjectiveList",
  "IpdosOption",
  "IpdosOptionList",
  "IpdosSolution",
  "IpdosSolutionMethods",
  "IpdosSolutionRef",
  "IpdosSolver",
  "IpdosStatistic",
  "IpdosStatisticList",
  "IpdosStatus",
  "IpdosType",
  "IpdosTypeBase",
  "IpdosTypeList",
  "IpdosValue",
  "IpdosValueKind",
  "IpdosValueMethods",
  "IpdosValueRef",
]
