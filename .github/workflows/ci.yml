name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes a queued run of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `just check-headers` proves the generated C compiles; it cannot notice that
  # the Rust it was generated from has moved on. This regenerates and fails on
  # any difference, which is the only thing that keeps a vendored copy of
  # `fznso_types.h` trustworthy.
  headers:
    name: C artifacts match the Rust source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v3
      - run: cargo install cbindgen --locked

      - name: Regenerate
        run: just build

      - name: c/ must match what cbindgen produces
        run: |
          if ! git diff --exit-code -- c/; then
            echo "::error::c/ is out of date. Run 'just build' and commit c/."
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Nightly first, so stable ends up the default: `just check` runs plain
      # `cargo clippy` and wants the stable lints, but `cargo +nightly fmt`
      # because this repo sets rustfmt options stable silently ignores.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v3
      - run: just check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v7

      # `just test-cpp` cross-builds the C++ suite for Windows when a mingw
      # toolchain is present, and skips it with a message otherwise. Installing
      # it here is what makes that path actually run somewhere.
      - name: Windows cross-compiler
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64

      # Rust workspace, the C++ suites under ASan/UBSan, and the Python
      # bindings built with maturin.
      - run: just test

  # The interface passes handles as raw pointers that each side casts back to
  # its own type. Every bug in that class has passed the ordinary suite first,
  # so this is not optional diligence. `tests/dylib.rs` is skipped here: miri
  # cannot `dlopen`, which is why `tests/abi.rs` drives the entry points
  # directly.
  miri:
    name: Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v3
      - run: just miri
