name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push supersedes a queued run of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `check-headers` proves the generated C compiles, not that it still matches
  # the Rust. Regenerating and diffing is what keeps a vendored copy honest.
  headers:
    name: C artifacts match the Rust source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - run: cargo install cbindgen --locked

      - name: Regenerate
        run: just build

      - name: c/ must match what cbindgen produces
        run: |
          if ! git diff --exit-code -- c/; then
            echo "::error::c/ is out of date. Run 'just build' and commit c/."
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Nightly first so stable is the default: `just check` runs plain `cargo
      # clippy`, but `cargo +nightly fmt` for the unstable rustfmt options.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - run: just check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v10.0.1

      # `just test-cpp` skips its Windows cross-build without mingw; installing
      # it here is what makes that path run somewhere.
      - name: Windows cross-compiler
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64

      # Rust workspace, the C++ suites under ASan/UBSan, and Python via maturin.
      - run: just test

  # Handles cross as raw pointers each side casts back; every bug in that class
  # has passed the ordinary suite first. `dylib.rs` skips itself (no `dlopen`).
  miri:
    name: Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - run: just miri
