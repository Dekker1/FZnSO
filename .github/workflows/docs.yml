name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Allow one deploy at a time, and let a newer commit supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5

      # The site's URL, including any custom domain, comes from the repository's
      # Pages settings rather than from a committed `CNAME`. A pull request from
      # a fork cannot read those settings, and never deploys either, so a
      # failure here is not fatal — `astro.config.mjs` falls back.
      - name: Pages settings
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      # Nightly: the reference is built from rustdoc's JSON output, which is
      # still an unstable format. `docs/scripts/api/rust.mjs` asserts the
      # version it was written against, so a format bump fails loudly here
      # rather than silently emitting empty pages.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@v3
      - run: sudo apt-get update && sudo apt-get install -y doxygen

      # `rehype-mermaid` renders diagrams to SVG in a real browser at build
      # time, which is what keeps them off the client and their labels as text.
      - name: Browser for diagram rendering
        run: |
          pnpm --dir docs install --frozen-lockfile
          pnpm --dir docs exec playwright install --with-deps chromium

      - name: Python toolchain for the reference
        run: |
          cd python
          uv venv --python 3.12
          . .venv/bin/activate
          uv pip install -q maturin griffe

      # Dumps every API surface and renders the reference pages. `-D warnings`
      # inside keeps the single-source rule honest: a doc comment linking to a
      # renamed item fails here rather than rotting silently — and those links
      # become real cross-page links in the rendered reference.
      - name: Reference and site
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          pnpm --dir docs install --frozen-lockfile
          just docs

      # Catches a spec anchor renamed out from under a link, in the prose and in
      # the doc comments that point at the site.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --base docs/dist 'docs/dist/**/*.html'
          fail: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
