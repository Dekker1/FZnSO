name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Allow one deploy at a time, and let a newer commit supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7

      # The site URL comes from Pages settings, not a committed `CNAME`. A fork
      # PR cannot read those and never deploys; `astro.config.mjs` falls back.
      - name: Pages settings
        id: pages
        uses: actions/configure-pages@v6
        continue-on-error: true

      # Nightly: the reference comes from rustdoc's unstable JSON. `api/rust.mjs`
      # asserts the format version, so a bump fails rather than empties a page.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - uses: astral-sh/setup-uv@v10.0.1
      - uses: extractions/setup-just@v4
      - run: sudo apt-get update && sudo apt-get install -y doxygen

      # `rehype-mermaid` renders diagrams to SVG in a real browser at build
      # time, which is what keeps them off the client and their labels as text.
      - name: Browser for diagram rendering
        run: |
          pnpm --dir docs install --frozen-lockfile
          pnpm --dir docs exec playwright install --with-deps chromium

      - name: Python toolchain for the reference
        run: |
          cd python
          uv venv --python 3.12
          . .venv/bin/activate
          uv pip install -q maturin griffe

      # Dumps every API surface and renders the reference. `-D warnings` inside
      # fails on a doc comment linking to a renamed item, rather than rotting.
      - name: Reference and site
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          pnpm --dir docs install --frozen-lockfile
          just docs

      # Outbound URLs and assets; `check-links.mjs` owns internal links and
      # anchors. `--root-dir` must be absolute; the exclusions are circular.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir '${{ github.workspace }}/docs/dist'
            --exclude '^https?://github\.com/${{ github.repository }}'
            --exclude '^https?://fznso\.minizinc\.dev'
            'docs/dist/**/*.html'
          fail: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
