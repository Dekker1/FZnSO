[meta]
order = 6
label = "Graphs & tables"
title = "Graph & extensional constraints"
description = "Graph structure constraints, and constraints defined by an explicit table or automaton."
intro = '''
Two families that share a shape: both describe a solution by reference to a structure given as data
rather than by an arithmetic relation.

**Graph constraints** take a fixed graph as two parallel arrays, `from` and `to`, one entry per edge.
Two Boolean arrays then select a subgraph: `nodes[v]` says vertex *v* is in it, and `edges[e]` says
edge *e* is.
The flow constraints are the exception: they decide a quantity per arc rather than a selection, so
they take a `flow` array in place of the two selectors.
`node_offset` is the number the caller's vertices start from, since the values in `from` and `to`
index `nodes` and a flat list cannot carry that numbering itself.
The two spanning-tree constraints carry no `nodes` array, every vertex being covered by definition,
and take a `node_count` in its place: a vertex in no edge is not recoverable from `from` and `to`,
and without one the constraint would hold on a graph it does not span.

**Extensional constraints** take the permitted assignments themselves: a table of tuples, or an
automaton that accepts them.

The graph constraints share a `graph_` prefix rather than a type prefix, because what they constrain
is the *structure* a subgraph takes and not the type of anything in it.
A constraint over directed edges takes a `_directed` suffix, so `graph_tree` and
`graph_tree_directed` sit together rather than being filed under `t` and `d`.
The extensional constraints are named for their element type, as everything else is.

`bounded_path` and its relatives are absent: bounding a path's weight is `graph_path` alongside a
`bool_lin_le` over the edge selectors, which introduces nothing new.
The tree constraints do carry a `weight` array, because their propagators filter with it; what they
report is `total_weight`, an equality, so bounding a tree means bounding that.
'''


# ---------------------------------------------------------------------------
# Notation used by the definitions on this page
# ---------------------------------------------------------------------------

[[notation]]
tex = 'V'
is = '= \{\, o, \ldots, o + n - 1 \,\}'
means = "the vertices of the given graph, where n is the length of nodes, or node_count where there is no such array"

[[notation]]
tex = 'o'
is = '= node_offset'
means = "the number the caller's vertices start from"

[[notation]]
tex = 'N'
is = '= \{\, v \in V \mid nodes_{v - o + 1} \,\}'
means = "the selected vertices"

[[notation]]
tex = 'E'
is = '= \{\, e \mid edges_e \,\}'
means = "the selected edges"

[[notation]]
tex = 'u \sim v'
is = '\iff \exists e \in E : \{ from_e, to_e \} = \{ u, v \}'
means = "a selected edge joins them"

[[notation]]
tex = 'u \to v'
is = '\iff \exists e \in E : from_e = u \wedge to_e = v'
means = "a selected arc runs from one to the other"

[[notation]]
tex = 'u \rightsquigarrow v'
means = "reachability: the reflexive-transitive closure of the adjacency above, taken over arcs in the directed constraints"

[[notation]]
tex = 'u \rightsquigarrow^{+} v'
means = "its transitive closure, so a vertex reaching itself needs a genuine cycle"

[[notation]]
tex = '\deg(v)'
is = '= \lvert \{\, e \in E \mid v \in \{ from_e, to_e \} \,\} \rvert'
means = "the degree, how many selected edges touch it"

[[notation]]
tex = '\deg^{-}(v)'
is = '= \lvert \{\, e \in E \mid to_e = v \,\} \rvert'
means = "the in-degree, how many selected arcs end at it"

[[notation]]
tex = '[P]'
is = '= 1 \text{ if } P,\; 0 \text{ otherwise}'
means = "the Iverson bracket"


# ---------------------------------------------------------------------------
# Circuits
# ---------------------------------------------------------------------------

[[entry]]
ident = "int_circuit"
args = ["list of var int: xs", "int: offset"]
summary = "The successor array describes a single circuit visiting every node exactly once."
definition = '\left( \forall i \neq j : xs_i \neq xs_j \right) \;\wedge\; \lvert \{\, \sigma^{k}(v) \mid 1 \leq k \leq \lvert xs \rvert \,\} \rvert = \lvert xs \rvert \quad \text{where } \sigma(i) = xs_{i - offset + 1}'
notes = "`xs` is numbered from `offset`, and its values name nodes in that same numbering. The Hamiltonian-circuit constraint behind most vehicle-routing models."

[[entry]]
ident = "int_subcircuit"
args = ["list of var int: xs", "int: offset"]
summary = "The successor array describes a single circuit over a subset of the nodes, with the rest as self-loops."
definition = '\left( \forall i \neq j : xs_i \neq xs_j \right) \;\wedge\; \lvert \{\, \sigma^{k}(v) \mid 1 \leq k \leq \lvert F \rvert \,\} \rvert = \lvert F \rvert \quad \text{where } \sigma(i) = xs_{i - offset + 1},\; F = \{\, i \mid \sigma(i) \neq i \,\},\; v \in F'
notes = "`xs` is numbered from `offset`. A node that maps to itself is unvisited; unlike `int_circuit`, nodes may be left out."

# ---------------------------------------------------------------------------
# Subgraph structure
# ---------------------------------------------------------------------------

[[entry]]
ident = "graph_subgraph"
args = ["list of int: from", "list of int: to", "int: node_offset", "list of var bool: nodes", "list of var bool: edges"]
summary = "The selected edges and nodes form a subgraph: every selected edge has both endpoints selected."
definition = '\forall e \in E : nodes_{from_e - node_offset + 1} \;\wedge\; nodes_{to_e - node_offset + 1}'
notes = "The well-formedness condition every other graph constraint here assumes."

[[entry]]
ident = "graph_connected"
args = ["list of int: from", "list of int: to", "int: node_offset", "list of var bool: nodes", "list of var bool: edges"]
summary = "The selected subgraph is connected."
definition = '\exists r \in N : \forall v \in N : r \rightsquigarrow v'
notes = "The empty selection does not satisfy this: some node has to be the root that the others are reached from."

[[entry]]
ident = "graph_connected_directed"
args = ["list of int: from", "list of int: to", "int: node_offset", "list of var bool: nodes", "list of var bool: edges"]
summary = "Every selected node of the directed subgraph is reachable from one of them."
definition = '\exists r \in N : \forall v \in N : r \rightsquigarrow v'
notes = "One-way reachability from a single root, not strong connectivity: an arc each way between two nodes is not asked for. This is the reading the MiniZinc library's `dconnected` implements. The empty selection does not satisfy it."

[[entry]]
ident = "graph_reachable"
args = ["list of int: from", "list of int: to", "int: node_offset", "var int: root", "list of var bool: nodes", "list of var bool: edges"]
summary = "Every selected node is reachable from the root in the selected subgraph."
definition = '\forall v \in N : root \rightsquigarrow v'

[[entry]]
ident = "graph_reachable_directed"
args = ["list of int: from", "list of int: to", "int: node_offset", "var int: root", "list of var bool: nodes", "list of var bool: edges"]
summary = "Every selected node is reachable from the root along the arcs' direction."
definition = '\forall v \in N : root \rightsquigarrow v'

[[entry]]
ident = "graph_acyclic_directed"
args = ["list of int: from", "list of int: to", "int: node_offset", "list of var bool: nodes", "list of var bool: edges"]
summary = "The selected directed subgraph contains no cycle, making it a DAG."
definition = '\nexists v \in N : v \rightsquigarrow^{+} v'

# ---------------------------------------------------------------------------
# Paths and trees
# ---------------------------------------------------------------------------

[[entry]]
ident = "graph_path"
args = ["list of int: from", "list of int: to", "int: node_offset", "var int: source", "var int: sink", "list of var bool: nodes", "list of var bool: edges"]
summary = "The selected subgraph is a simple path from the source to the sink."
definition = '\left( \forall u, v \in N : u \rightsquigarrow v \right) \;\wedge\; \forall v \in N : \deg(v) = 2 - [\, v = source \,] - [\, v = sink \,]'

[[entry]]
ident = "graph_path_directed"
args = ["list of int: from", "list of int: to", "int: node_offset", "var int: source", "var int: sink", "list of var bool: nodes", "list of var bool: edges"]
summary = "The selected subgraph is a simple directed path from the source to the sink."
definition = '\left( source \rightsquigarrow sink \right) \;\wedge\; \forall v \in N : \deg^{-}(v) = [\, v \neq source \,] \;\wedge\; \lvert E \rvert = \lvert N \rvert - 1'



[[entry]]
ident = "graph_tree"
args = ["list of int: from", "list of int: to", "int: node_offset", "var int: root", "list of var bool: nodes", "list of var bool: edges"]
summary = "The selected subgraph is a tree rooted at the given node."
definition = '\left( \forall u, v \in N : u \rightsquigarrow v \right) \;\wedge\; \lvert E \rvert = \lvert N \rvert - 1 \;\wedge\; root \in N'

[[entry]]
ident = "graph_tree_directed"
args = ["list of int: from", "list of int: to", "int: node_offset", "var int: root", "list of var bool: nodes", "list of var bool: edges"]
summary = "The selected subgraph is a directed tree with all arcs pointing away from the root."
definition = '\forall v \in N : \deg^{-}(v) = [\, v \neq root \,] \;\wedge\; root \rightsquigarrow v'

[[entry]]
ident = "graph_steiner_tree"
args = ["list of int: from", "list of int: to", "int: node_offset", "list of int: weight", "list of var bool: nodes", "list of var bool: edges", "var int: total_weight"]
summary = "The selected subgraph is a tree, reporting its total edge weight."
definition = '\left( \forall u, v \in N : u \rightsquigarrow v \right) \;\wedge\; \lvert E \rvert = \lvert N \rvert - 1 \;\wedge\; total_weight = \sum_{e \in E} weight_e'
notes = "Which nodes to include is part of the decision, which is what makes it a Steiner tree rather than a spanning tree."

[[entry]]
ident = "graph_steiner_tree_directed"
args = ["list of int: from", "list of int: to", "int: node_offset", "list of int: weight", "var int: root", "list of var bool: nodes", "list of var bool: edges", "var int: total_weight"]
summary = "The selected subgraph is a directed tree from the root, reporting its total arc weight."
definition = '\left( \forall v \in N : \deg^{-}(v) = [\, v \neq root \,] \;\wedge\; root \rightsquigarrow v \right) \;\wedge\; total_weight = \sum_{e \in E} weight_e'

[[entry]]
ident = "graph_spanning_tree"
args = ["list of int: from", "list of int: to", "int: node_offset", "int: node_count", "list of int: weight", "list of var bool: edges", "var int: total_weight"]
summary = "The selected edges span every node of the graph, reporting their total weight."
definition = 'N = V \;\wedge\; \left( \forall u, v \in V : u \rightsquigarrow v \right) \;\wedge\; \lvert E \rvert = \lvert V \rvert - 1 \;\wedge\; total_weight = \sum_{e \in E} weight_e'
notes = "Unlike `graph_steiner_tree`, every node must be covered, so `node_count` stands in for the `nodes` array whose length gives the vertex count elsewhere."

[[entry]]
ident = "graph_spanning_tree_directed"
args = ["list of int: from", "list of int: to", "int: node_offset", "int: node_count", "list of int: weight", "var int: root", "list of var bool: edges", "var int: total_weight"]
summary = "The selected arcs form a spanning arborescence from the root, reporting their total weight."
definition = '\forall v \in V : \deg^{-}(v) = [\, v \neq root \,] \;\wedge\; root \rightsquigarrow v \;\wedge\; total_weight = \sum_{e \in E} weight_e'

# ---------------------------------------------------------------------------
# Flow
# ---------------------------------------------------------------------------

[[entry]]
ident = "graph_network_flow"
args = ["list of int: from", "list of int: to", "int: node_offset", "list of int: balance", "list of var int: flow"]
summary = "The flow on each arc satisfies the given supply and demand at every node."
definition = '\forall v : \sum_{e \,:\, from_e = v} flow_e \;-\; \sum_{e \,:\, to_e = v} flow_e \;=\; balance_{v - node_offset + 1}'
notes = "The graph is given as `from` and `to`, one entry per arc, the same way every other constraint here takes one. `balance` is numbered from `node_offset`: a positive value is supply, a negative one demand. Unlike the rest of the family there are no selector arrays, because every arc carries a flow rather than being in or out."

[[entry]]
ident = "graph_network_flow_cost"
args = ["list of int: from", "list of int: to", "int: node_offset", "list of int: balance", "list of int: weight", "list of var int: flow", "var int: total_cost"]
summary = "As graph_network_flow, and the total cost is the weighted sum of the flows."
definition = 'total_cost = \sum_{e} weight_e \cdot flow_e'

# ---------------------------------------------------------------------------
# Extensional
# ---------------------------------------------------------------------------

[[entry]]
ident = "int_table"
args = ["list of var int: xs", "list of int: tuples"]
summary = "The assignment to the array appears as a row of the given table."
definition = '\exists r : \forall j : xs_j = tuples_{(r-1) \cdot \lvert xs \rvert + j}'
notes = "`tuples` is the table flattened row-major, one permitted assignment per row. No row length is needed: the rows are as long as `xs`. The most direct way to state a relation with no closed form."


[[entry]]
ident = "bool_table"
args = ["list of var bool: xs", "list of bool: tuples"]
summary = "The Boolean assignment appears as a row of the given table."
definition = '\exists r : \forall j : xs_j \leftrightarrow tuples_{(r-1) \cdot \lvert xs \rvert + j}'
notes = "`tuples` is the table flattened row-major; the rows are as long as `xs`."

[[entry]]
ident = "int_regular"
args = ["list of var int: xs", "int: states", "int: alphabet", "int: alphabet_offset", "list of int: transition", "int: initial", "set of int: accepting"]
summary = "The array, read as a string, is accepted by the given deterministic automaton."
definition = 'q_0 = initial \;\wedge\; q_j = transition_{q_{j-1},\, xs_j - alphabet_offset + 1} \;\wedge\; q_{\lvert xs \rvert} \in accepting'
notes = "`transition` is the state-by-symbol table flattened row-major, `states` rows of `alphabet` entries, so no row length travels with it. A transition to 0 means the string is rejected. States are numbered from 1; symbols from `alphabet_offset`, so `xs` keeps the caller's own alphabet."

[[entry]]
ident = "int_regular_nondeterministic"
args = ["list of var int: xs", "int: states", "int: alphabet", "int: alphabet_offset", "list of set of int: transition", "int: initial", "set of int: accepting"]
summary = "The array, read as a string, is accepted by the given non-deterministic automaton."
definition = '\exists q : q_0 = initial \;\wedge\; q_j \in transition_{q_{j-1},\, xs_j - alphabet_offset + 1} \;\wedge\; q_{\lvert xs \rvert} \in accepting'
notes = "As `int_regular`, but each transition gives a set of possible next states."

[[entry]]
ident = "int_regular_cost"
args = ["list of var int: xs", "int: states", "int: alphabet", "int: alphabet_offset", "list of int: transition", "int: initial", "set of int: accepting", "list of int: weight", "var int: total_cost"]
summary = "As int_regular, and the total cost sums the weight of each transition taken."
definition = 'total_cost = \sum_{j} weight_{q_{j-1},\, xs_j - alphabet_offset + 1}'

[[entry]]
ident = "int_mdd"
args = ["list of var int: xs", "int: nodes", "list of int: level", "int: edges", "list of int: from", "list of set of int: label", "list of int: to"]
summary = "The assignment corresponds to a root-to-leaf path through the given multi-valued decision diagram."
definition = '\exists e_1, \ldots, e_{\lvert xs \rvert} : from_{e_1} = 1 \;\wedge\; \forall j : \left( to_{e_j} = from_{e_{j+1}} \;\wedge\; xs_j \in label_{e_j} \right)'
notes = "`level` gives each node's layer, and `from`, `label` and `to` describe the edges. Nodes are numbered from 1, so no offset travels with them. A compact alternative to `int_table` when the relation factorises.\n\nThe diagram must be **deterministic**: no two edges leaving a node may share a label. `int_mdd_nondeterministic` is the form without that requirement."


[[entry]]
ident = "int_mdd_nondeterministic"
args = ["list of var int: xs", "int: nodes", "list of int: level", "int: edges", "list of int: from", "list of set of int: label", "list of int: to"]
summary = "The assignment corresponds to some root-to-leaf path through the given decision diagram."
definition = '\exists e_1, \ldots, e_{\lvert xs \rvert} : from_{e_1} = 1 \;\wedge\; \forall j : \left( to_{e_j} = from_{e_{j+1}} \;\wedge\; xs_j \in label_{e_j} \right)'
notes = "As `int_mdd`, but edges leaving a node may share a label, so an assignment may be accepted along several paths. A separate name because a propagator written for the deterministic form is wrong here."

[[entry]]
ident = "int_mdd_cost"
args = ["list of var int: xs", "int: nodes", "list of int: level", "int: edges", "list of int: from", "list of set of int: label", "list of int: weight", "list of int: to", "var int: total_cost"]
summary = "As int_mdd, and the total cost sums the weight of each edge on the chosen path."
definition = '\exists e_1, \ldots, e_{\lvert xs \rvert} : from_{e_1} = 1 \;\wedge\; \left( \forall j : to_{e_j} = from_{e_{j+1}} \;\wedge\; xs_j \in label_{e_j} \right) \;\wedge\; total_cost = \sum_{j} weight_{e_j}'
