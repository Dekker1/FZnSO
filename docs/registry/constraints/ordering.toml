[meta]
order = 4
label = "Ordering & counting"
title = "Ordering & counting constraints"
description = "All-different, counting, lexicographic ordering, monotonicity and channelling constraints over arrays."
intro = '''
The global constraints that say something about an array as a whole: that its values are distinct,
how often a value occurs, how two arrays compare, or how two arrays encode the same information.

These are where a solver's dedicated propagators earn their keep.
Declaring one commits you to the meaning below; a solver that would rather have the constraint
decomposed simply does not declare it, and the application decomposes instead.
'''


# ---------------------------------------------------------------------------
# Notation used by the definitions on this page
# ---------------------------------------------------------------------------

[[notation]]
tex = '\operatorname{col}_j(xs)'
is = '= \left( xs_{j},\; xs_{j + columns},\; xs_{j + 2\,columns},\; \ldots \right)'
means = "column j of a matrix passed flat, row-major, with the given number of entries per row"

[[notation]]
tex = 'u \preceq v'
means = "lexicographic order on tuples: either they are equal, or at the first position where they differ the left one is smaller"

[[notation]]
tex = 'u \prec v'
means = "its strict form"


# ---------------------------------------------------------------------------
# All-different and related
# ---------------------------------------------------------------------------

[[entry]]
ident = "int_all_different"
args = ["list of var int: xs"]
reified = ["int_all_different_reif"]
summary = "No value occurs twice in the array."
definition = '\forall i < j : xs_i \neq xs_j'

[[entry]]
ident = "int_all_different_except"
args = ["list of var int: xs", "set of int: except"]
summary = "No value occurs twice, except for values in the given set, which may repeat freely."
definition = '\forall i < j : xs_i \neq xs_j \;\vee\; xs_i \in except'
notes = "The common case of a value marking an unused slot is this constraint with `except = {0}`."

[[entry]]
ident = "set_of_int_all_different"
args = ["list of var set of int: xs"]
summary = "No two elements of the array are the same set."
definition = '\forall i < j : xs_i \neq xs_j'

[[entry]]
ident = "int_all_equal"
args = ["list of var int: xs"]
summary = "Every element of the array takes the same value."
definition = '\forall i, j : xs_i = xs_j'

[[entry]]
ident = "set_of_int_all_equal"
args = ["list of var set of int: xs"]
summary = "Every element of the array is the same set."
definition = '\forall i, j : xs_i = xs_j'

[[entry]]
ident = "set_of_int_all_disjoint"
args = ["list of var set of int: xs"]
summary = "No two sets in the array share a member."
definition = '\forall i < j : xs_i \cap xs_j = \emptyset'

[[entry]]
ident = "int_nvalue"
args = ["var int: n", "list of var int: xs"]
summary = "The count is how many distinct values the array takes."
definition = 'n = \lvert \{\, xs_i \mid i \,\} \rvert'
notes = "`n = 1` is `int_all_equal`; `n = length(xs)` is `int_all_different`."

[[entry]]
ident = "int_symmetric_all_different"
args = ["list of var int: xs"]
summary = "The array is a permutation that is its own inverse."
definition = '\forall i : xs_{xs_i} = i'

# ---------------------------------------------------------------------------
# Counting
# ---------------------------------------------------------------------------

[[entry]]
ident = "int_count_eq"
args = ["list of var int: xs", "var int: value", "var int: n"]
summary = "The value occurs exactly the given number of times in the array."
definition = 'n = \lvert \{\, i \mid xs_i = value \,\} \rvert'

[[entry]]
ident = "int_count_leq"
args = ["list of var int: xs", "var int: value", "var int: n"]
summary = "The value occurs at most the given number of times."
definition = '\lvert \{\, i \mid xs_i = value \,\} \rvert \leq n'
notes = "Strictly fewer than `n` is this constraint with `n - 1`."

[[entry]]
ident = "int_count_geq"
args = ["list of var int: xs", "var int: value", "var int: n"]
summary = "The value occurs at least the given number of times."
definition = '\lvert \{\, i \mid xs_i = value \,\} \rvert \geq n'
notes = "Strictly more than `n` is this constraint with `n + 1`."

[[entry]]
ident = "int_count_neq"
args = ["list of var int: xs", "var int: value", "var int: n"]
summary = "The number of occurrences of the value differs from the given count."
definition = '\lvert \{\, i \mid xs_i = value \,\} \rvert \neq n'

[[entry]]
ident = "bool_count_eq"
args = ["list of var bool: xs", "var bool: value", "var int: n"]
summary = "The value occurs exactly the given number of times in the array."
definition = 'n = \lvert \{\, i \mid xs_i \leftrightarrow value \,\} \rvert'

[[entry]]
ident = "float_count_eq"
args = ["list of var float: xs", "var float: value", "var int: n"]
summary = "The value occurs exactly the given number of times in the array."
definition = 'n = \lvert \{\, i \mid xs_i = value \,\} \rvert'

[[entry]]
ident = "set_of_int_count_eq"
args = ["list of var set of int: xs", "var set of int: value", "var int: n"]
summary = "The value occurs exactly the given number of times in the array."
definition = 'n = \lvert \{\, i \mid xs_i = value \,\} \rvert'

[[entry]]
ident = "int_among"
args = ["var int: n", "list of var int: xs", "set of int: values"]
summary = "The count is how many array elements take a value from the given set."
definition = 'n = \lvert \{\, i \mid xs_i \in values \,\} \rvert'
notes = "Counting a single value is `int_count_eq`; this counts membership of a set."

[[entry]]
ident = "int_sliding_among"
args = ["list of var int: xs", "set of int: values", "int: window", "int: lower_bound", "int: upper_bound"]
summary = "Every window of consecutive elements contains between the given bounds of the chosen values."
definition = '\forall k : lower_bound \leq \lvert \{\, i \in [k, k + window) \mid xs_i \in values \,\} \rvert \leq upper_bound'

[[entry]]
ident = "int_sliding_sum"
args = ["int: lower_bound", "int: upper_bound", "int: window", "list of var int: xs"]
summary = "Every window of consecutive elements sums to a value between the given bounds."
definition = '\forall k : lower_bound \leq \sum_{i \in [k,\, k + window)} xs_i \leq upper_bound'

[[entry]]
ident = "int_var_perm_sym"
args = ["list of var int: xs", "list of int: permutations"]
summary = "The array is lexicographically no greater than any of its listed permutations."
definition = '\forall p : xs \preceq \left( xs_{permutations_{p,1}}, xs_{permutations_{p,2}}, \ldots \right)'
notes = "`permutations` is flattened row-major, one permutation per row; no row length travels with it because the rows are as long as `xs`. A general symmetry break for a known symmetry group."

[[entry]]
ident = "int_var_sqr_sym"
args = ["list of var int: xs", "int: columns"]
summary = "A square matrix is lexicographically no greater than its transpose, or any row and column permutation of itself."
definition = '\left( xs_{(i-1)c+j} \right)_{i,j} \preceq \left( xs_{(j-1)c+i} \right)_{i,j} \quad \text{where } c = columns'

[[entry]]
ident = "int_global_cardinality"
args = ["list of var int: xs", "list of int: cover", "list of var int: count"]
summary = "Each covered value occurs as many times in the array as its matching count says."
definition = '\forall j : count_j = \lvert \{\, i \mid xs_i = cover_j \,\} \rvert'
notes = "Values outside `cover` are unconstrained. `cover` and `count` must have equal length."

[[entry]]
ident = "int_global_cardinality_closed"
args = ["list of var int: xs", "list of int: cover", "list of var int: count"]
summary = "As int_global_cardinality, and additionally every array element must take a covered value."
definition = '\forall i : xs_i \in cover \;\wedge\; \forall j : count_j = \lvert \{\, i \mid xs_i = cover_j \,\} \rvert'

[[entry]]
ident = "int_global_cardinality_low_up"
args = ["list of var int: xs", "list of int: cover", "list of int: lower_bound", "list of int: upper_bound"]
summary = "Each covered value occurs a number of times between its lower and upper bound."
definition = '\forall j : lower_bound_j \leq \lvert \{\, i \mid xs_i = cover_j \,\} \rvert \leq upper_bound_j'
notes = "Kept alongside `int_global_cardinality`, which would need count variables introduced to say the same thing."

[[entry]]
ident = "int_global_cardinality_low_up_closed"
args = ["list of var int: xs", "list of int: cover", "list of int: lower_bound", "list of int: upper_bound"]
summary = "As int_global_cardinality_low_up, and additionally every array element must take a covered value."
definition = '\forall i : xs_i \in cover \;\wedge\; \forall j : lower_bound_j \leq \lvert \{\, i \mid xs_i = cover_j \,\} \rvert \leq upper_bound_j'

[[entry]]
ident = "int_distribute"
args = ["list of var int: count", "list of var int: cover", "list of var int: xs"]
summary = "Each count says how often its matching value occurs in the array, with the values themselves variable."
definition = '\forall j : count_j = \lvert \{\, i \mid xs_i = cover_j \,\} \rvert'
notes = "Unlike `int_global_cardinality`, the values being counted are decision variables rather than constants."

# ---------------------------------------------------------------------------
# Monotonicity
# ---------------------------------------------------------------------------

[[entry]]
ident = "int_increasing"
args = ["list of var int: xs"]
reified = ["int_increasing_reif"]
summary = "The array is in non-decreasing order."
definition = '\forall i < j : xs_i \leq xs_j'
notes = "Non-increasing order is this constraint over the reversed array."

[[entry]]
ident = "bool_increasing"
args = ["list of var bool: xs"]
reified = ["bool_increasing_reif"]
summary = "The array is in non-decreasing order, taking false below true."
definition = '\forall i < j : xs_i \rightarrow xs_j'

[[entry]]
ident = "float_increasing"
args = ["list of var float: xs"]
summary = "The array is in non-decreasing order."
definition = '\forall i < j : xs_i \leq xs_j'

[[entry]]
ident = "set_of_int_increasing"
args = ["list of var set of int: xs"]
summary = "The array is in non-decreasing order under the standard total order on sets."
definition = '\forall i < j : xs_i \preceq xs_j'

[[entry]]
ident = "int_strictly_increasing"
args = ["list of var int: xs"]
summary = "The array is in strictly increasing order, so no value repeats."
definition = '\forall i < j : xs_i < xs_j'

[[entry]]
ident = "float_strictly_increasing"
args = ["list of var float: xs"]
summary = "The array is in strictly increasing order, so no value repeats."
definition = '\forall i < j : xs_i < xs_j'

[[entry]]
ident = "set_of_int_strictly_increasing"
args = ["list of var set of int: xs"]
summary = "The array is strictly increasing under the standard total order on sets."
definition = '\forall i < j : xs_i \prec xs_j'

# ---------------------------------------------------------------------------
# Lexicographic ordering
# ---------------------------------------------------------------------------

[[entry]]
ident = "int_lex_lesseq"
args = ["list of var int: xs", "list of var int: ys"]
reified = ["int_lex_lesseq_reif"]
summary = "The first array is before or equal to the second in lexicographic order."
definition = 'xs = ys \;\vee\; \exists k : \left( \forall i < k : xs_i = ys_i \right) \wedge xs_k < ys_k'
notes = "The arrays need not have equal length; a proper prefix is lexicographically smaller."

[[entry]]
ident = "int_lex_less"
args = ["list of var int: xs", "list of var int: ys"]
reified = ["int_lex_less_reif"]
summary = "The first array is strictly before the second in lexicographic order."
definition = '\exists k : \left( \forall i < k : xs_i = ys_i \right) \wedge xs_k < ys_k'

[[entry]]
ident = "bool_lex_lesseq"
args = ["list of var bool: xs", "list of var bool: ys"]
summary = "The first array is before or equal to the second in lexicographic order."
definition = 'xs = ys \;\vee\; \exists k : \left( \forall i < k : xs_i = ys_i \right) \wedge \neg xs_k \wedge ys_k'

[[entry]]
ident = "bool_lex_less"
args = ["list of var bool: xs", "list of var bool: ys"]
summary = "The first array is strictly before the second in lexicographic order."
definition = '\exists k : \left( \forall i < k : xs_i = ys_i \right) \wedge \neg xs_k \wedge ys_k'

[[entry]]
ident = "float_lex_lesseq"
args = ["list of var float: xs", "list of var float: ys"]
summary = "The first array is before or equal to the second in lexicographic order."
definition = 'xs = ys \;\vee\; \exists k : \left( \forall i < k : xs_i = ys_i \right) \wedge xs_k < ys_k'

[[entry]]
ident = "float_lex_less"
args = ["list of var float: xs", "list of var float: ys"]
summary = "The first array is strictly before the second in lexicographic order."
definition = '\exists k : \left( \forall i < k : xs_i = ys_i \right) \wedge xs_k < ys_k'

[[entry]]
ident = "set_of_int_lex_lesseq"
args = ["list of var set of int: xs", "list of var set of int: ys"]
summary = "The first array is before or equal to the second in lexicographic order."
definition = 'xs = ys \;\vee\; \exists k : \left( \forall i < k : xs_i = ys_i \right) \wedge xs_k \prec ys_k'

[[entry]]
ident = "set_of_int_lex_less"
args = ["list of var set of int: xs", "list of var set of int: ys"]
summary = "The first array is strictly before the second in lexicographic order."
definition = '\exists k : \left( \forall i < k : xs_i = ys_i \right) \wedge xs_k \prec ys_k'

[[entry]]
ident = "int_lex_chain_lesseq"
args = ["list of var int: xs", "int: columns"]
summary = "The columns of a matrix are in non-decreasing lexicographic order."
definition = '\forall j : \operatorname{col}_j(xs) \preceq \operatorname{col}_{j+1}(xs)'
notes = "`xs` is the matrix flattened row-major, `columns` entries per row. Constraining rows as well as columns is this constraint applied to the matrix and to its transpose."

[[entry]]
ident = "int_lex_chain_less"
args = ["list of var int: xs", "int: columns"]
summary = "The columns of a matrix are in strictly increasing lexicographic order."
definition = '\forall j : \operatorname{col}_j(xs) \prec \operatorname{col}_{j+1}(xs)'

[[entry]]
ident = "bool_lex_chain_lesseq"
args = ["list of var bool: xs", "int: columns"]
summary = "The columns of a Boolean matrix are in non-decreasing lexicographic order."
definition = '\forall j : \operatorname{col}_j(xs) \preceq \operatorname{col}_{j+1}(xs)'

[[entry]]
ident = "bool_lex_chain_less"
args = ["list of var bool: xs", "int: columns"]
summary = "The columns of a Boolean matrix are in strictly increasing lexicographic order."
definition = '\forall j : \operatorname{col}_j(xs) \prec \operatorname{col}_{j+1}(xs)'

# ---------------------------------------------------------------------------
# Value precedence
# ---------------------------------------------------------------------------

[[entry]]
ident = "int_value_precede"
args = ["int: s", "int: t", "list of var int: xs"]
summary = "If the second value occurs at all, the first occurs somewhere before it."
definition = '\forall j : xs_j = t \rightarrow \exists i < j : xs_i = s'
notes = "Breaks the symmetry between interchangeable values, for example colours in a graph colouring. A chain of precedences is this constraint applied to each consecutive pair."

[[entry]]
ident = "set_of_int_value_precede"
args = ["int: s", "int: t", "list of var set of int: xs"]
summary = "If the second value occurs in any set, the first occurs in an earlier one."
definition = '\forall j : t \in xs_j \rightarrow \exists i < j : s \in xs_i'

[[entry]]
ident = "int_seq_precede_chain"
args = ["list of var int: xs"]
summary = "A value may only be used once every smaller non-negative value has already been used."
definition = '\forall j : xs_j > 0 \rightarrow \exists i < j : xs_i = xs_j - 1'
notes = "The canonical symmetry break for problems where values name interchangeable groups."

[[entry]]
ident = "set_of_int_seq_precede_chain"
args = ["list of var set of int: xs"]
summary = "A value may only appear in a set once every smaller non-negative value has appeared in an earlier one."
definition = '\forall j, v > 0 : v \in xs_j \rightarrow \exists i < j : v - 1 \in xs_i'

# ---------------------------------------------------------------------------
# Channelling
# ---------------------------------------------------------------------------

[[entry]]
ident = "int_inverse"
args = ["list of var int: f", "int: f_offset", "list of var int: invf", "int: invf_offset"]
summary = "The two arrays are mutually inverse permutations."
definition = '\forall i, j : f_{i - f_offset + 1} = j \leftrightarrow invf_{j - invf_offset + 1} = i'
notes = "Each array is read in the caller's numbering: `f` from `f_offset`, `invf` from `invf_offset`. The standard channelling between a permutation and its inverse."

[[entry]]
ident = "int_inverse_in_range"
args = ["list of var int: f", "int: f_offset", "list of var int: invf", "int: invf_offset"]
summary = "Each array inverts the other wherever the index is in range, leaving the rest free."
definition = '\forall i, j : f_{i - f_offset + 1} = j \rightarrow invf_{j - invf_offset + 1} = i'
notes = "The one-sided form, for when the arrays have different index ranges."

[[entry]]
ident = "set_of_int_inverse"
args = ["list of var set of int: f", "int: f_offset", "list of var set of int: invf", "int: invf_offset"]
summary = "The two arrays of sets describe the same relation, read in opposite directions."
definition = '\forall i, j : j \in f_{i - f_offset + 1} \leftrightarrow i \in invf_{j - invf_offset + 1}'
