[meta]
order = 3
label = "Sets"
title = "Set constraints"
description = "Membership, cardinality, the set operations, and constraints channelling between sets and other representations."
intro = """
Constraints over finite sets of integers.
A solver that declares `var set of int` in its
[decision types](../../../spec/entry-points/#the-library) should expect these; one that does not may
still accept `set_of_int_in`, whose set argument is constant.

Sets cross the interface as [range lists](../../../spec/types-and-values/#sets), so a solver never
sees an enumerated membership list for a large interval.

There is no `set_of_int_superset`: it is `set_of_int_subset` with the arguments the other way round.
"""

# ---------------------------------------------------------------------------
# Membership and cardinality
# ---------------------------------------------------------------------------

[[entry]]
ident = "set_of_int_in"
args = ["var int: x", "var set of int: values"]
reified = ["set_of_int_in_reif", "set_of_int_in_imp"]
summary = "The integer is a member of the set."
definition = 'x \in values'
notes = "Declared with both sides variable, which is the general case. A solver that only supports a constant set says so by [declaring `values` as a parameter](../../../spec/entry-points/#declaring-a-narrower-argument-type); it is then the application's job not to reach for it when the set is a decision variable. Against a constant set this says the same thing as restricting the variable's `decision_domain`, but as a posted constraint rather than a declaration."

[[entry]]
ident = "set_of_int_at_most1"
args = ["list of var set of int: xs"]
reified = ["set_of_int_at_most1_reif"]
summary = "No two sets in the array share more than one member."
definition = '\forall i < j : \lvert xs_i \cap xs_j \rvert \leq 1'

[[entry]]
ident = "set_of_int_card"
args = ["var set of int: s", "var int: n"]
summary = "The count is the number of elements in the set."
definition = 'n = \lvert s \rvert'

# ---------------------------------------------------------------------------
# Comparison
# ---------------------------------------------------------------------------

[[entry]]
ident = "set_of_int_eq"
args = ["var set of int: s", "var set of int: t"]
reified = ["set_of_int_eq_reif"]
summary = "The two sets have the same members."
definition = 's = t'

[[entry]]
ident = "set_of_int_ne"
args = ["var set of int: s", "var set of int: t"]
reified = ["set_of_int_ne_reif"]
summary = "The two sets differ in at least one member."
definition = 's \neq t'

[[entry]]
ident = "set_of_int_subset"
args = ["var set of int: s", "var set of int: t"]
reified = ["set_of_int_subset_reif"]
summary = "Every member of the first set is a member of the second."
definition = 's \subseteq t'

[[entry]]
ident = "set_of_int_le"
args = ["var set of int: s", "var set of int: t"]
summary = "The first set is no greater than the second in the standard total order on sets."
definition = 's \preceq t'
notes = "The order compares sets by their smallest differing element. It is total, which is what lets sets be used where an ordering is needed."

[[entry]]
ident = "set_of_int_lt"
args = ["var set of int: s", "var set of int: t"]
summary = "The first set is strictly less than the second in the standard total order on sets."
definition = 's \prec t'

# ---------------------------------------------------------------------------
# Set operations
# ---------------------------------------------------------------------------

[[entry]]
ident = "set_of_int_union"
args = ["var set of int: s", "var set of int: t", "var set of int: result"]
summary = "The result contains exactly the members of either operand."
definition = 'result = s \cup t'

[[entry]]
ident = "set_of_int_intersect"
args = ["var set of int: s", "var set of int: t", "var set of int: result"]
summary = "The result contains exactly the members common to both operands."
definition = 'result = s \cap t'

[[entry]]
ident = "set_of_int_diff"
args = ["var set of int: s", "var set of int: t", "var set of int: result"]
summary = "The result contains the members of the first operand that are not in the second."
definition = 'result = s \setminus t'

[[entry]]
ident = "set_of_int_symdiff"
args = ["var set of int: s", "var set of int: t", "var set of int: result"]
summary = "The result contains the members of exactly one of the two operands."
definition = 'result = (s \setminus t) \cup (t \setminus s)'

[[entry]]
ident = "set_of_int_array_union"
args = ["list of var set of int: xs", "var set of int: result"]
summary = "The result is the union of every set in the array."
definition = 'result = \bigcup_{i} xs_i'

[[entry]]
ident = "set_of_int_array_intersect"
args = ["list of var set of int: xs", "var set of int: result"]
summary = "The result is the intersection of every set in the array."
definition = 'result = \bigcap_{i} xs_i'

[[entry]]
ident = "int_array_union"
args = ["list of var int: xs", "var set of int: result"]
summary = "The result is the set of values the integer array takes."
definition = 'result = \{\, xs_i \mid i \,\}'

# ---------------------------------------------------------------------------
# Partitioning and channelling
# ---------------------------------------------------------------------------

[[entry]]
ident = "set_of_int_partition"
args = ["list of var set of int: xs", "set of int: universe"]
summary = "The sets are pairwise disjoint and together cover the universe exactly."
definition = '\bigcup_{i} xs_i = universe \;\wedge\; \forall i < j : xs_i \cap xs_j = \emptyset'

[[entry]]
ident = "set_of_int_to_bool"
args = ["var set of int: s", "list of var bool: flags", "int: offset"]
summary = "Each Boolean records whether the corresponding index is a member of the set."
definition = '\forall i : flags_{i - offset + 1} \leftrightarrow i \in s'
notes = "The standard channelling between a set variable and its characteristic vector."

[[entry]]
ident = "int_set_channel"
args = ["list of var int: ints", "int: int_offset", "list of var set of int: sets", "int: set_offset"]
summary = "Element i of the integer array names a set that contains i, and every such membership is mirrored."
definition = '\forall i, j : ints_{i - int_offset + 1} = j \leftrightarrow i \in sets_{j - set_offset + 1}'

[[entry]]
ident = "int_array_roots"
args = ["list of var int: xs", "int: offset", "var set of int: s", "var set of int: values"]
summary = "The set holds exactly those indices whose array element lies in the given value set."
definition = '\forall i : i \in s \leftrightarrow xs_{i - offset + 1} \in values'

[[entry]]
ident = "int_array_range"
args = ["list of var int: xs", "int: offset", "var set of int: domain", "var set of int: image"]
summary = "The image is exactly the set of values the array takes at the given indices."
definition = 'image = \{\, xs_{i - offset + 1} \mid i \in domain \,\}'
