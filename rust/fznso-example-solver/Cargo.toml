[package]
name = "fznso-example-solver"
repository.workspace = true
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

publish = false

# `cdylib` only. An `rlib` would let `tests/dylib.rs` depend on this crate, but
# it would also link these `no_mangle` symbols into every other test target in
# `fznso` that exports the ABI itself, which collides at link time.
[lib]
crate-type = ["cdylib"]

[dependencies]
fznso = { path = "../fznso" }

[lints]
workspace = true
