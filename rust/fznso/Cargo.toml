[package]
name = "fznso"
repository.workspace = true
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
flatzinc-serde = ["dep:flatzinc-serde"]

[dependencies]
fznso-types = { path = "../fznso-types" }
rangelist = "0.5.0"
flatzinc-serde = { version = "0.5.1", optional = true }
libloading = "0.8.9"

# Example solvers, built as `cdylib`s so the loaders can `dlopen` them. They are
# the canonical Rust solver implementations the whole workspace tests against.
[[example]]
name = "example_solver"
crate-type = ["cdylib"]

[[example]]
name = "bad_abi_solver"
crate-type = ["cdylib"]

[[example]]
name = "threaded_solver"
crate-type = ["cdylib"]

[lints]
workspace = true
